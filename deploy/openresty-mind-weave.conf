# ============================================================
# MindWeave · 织脑 - OpenResty 站点配置（OnePanel 站点配置文件）
# 域名：wei6130.top
# 对外端口：8445（因服务器不放行 80/443，改用自定义 HTTPS 端口）
# 访问地址：https://wei6130.top:8445
# ============================================================
server {
    listen 8445 ssl;
    server_name wei6130.top;

    # 证书路径：替换为你实际申请的证书位置（推荐 acme.sh DNS 验证签发的证书）
    ssl_certificate     /path/to/wei6130.top/fullchain.pem;
    ssl_certificate_key /path/to/wei6130.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 前端静态文件目录（mind-weave-frontend/dist 上传到这里）
    root /vol1/1000/dev/mind-weave-frontend;
    index index.html;

    access_log /vol1/1000/dev/logs/salary.access.log;
    error_log  /vol1/1000/dev/logs/salary.error.log;

    client_max_body_size 120m;        # Excel 导入与文章附件（后端上限 100MB）

    # 静态资源压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA 前端路由回退（刷新 /records 等页面不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理（后端只监听本机 8080，不对外暴露）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        # 上传大附件/大 Excel 时不能被中途掐断
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    # 带哈希的静态资源可长缓存。
    # 必须用 ^~ ：nginx 的正则 location 优先级高于普通前缀 location，
    # 否则 /api/tool/attachments/1/content.png 这类"以图片扩展名结尾的 API 路径"
    # 会被这条规则抢走，永远到不了后端 —— 表现为文章里的图片全部无法显示。
    location ^~ /assets/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}

